spring:
  application:
    name: translator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/translator}
    username: ${DB_USER:translator}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 0
  error:
    include-message: never
    include-stacktrace: never
translator:
  security:
    issuer: ${JWT_ISSUER:translator}
    audience: ${JWT_AUDIENCE:translator-api}
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    auth-requests-per-minute: ${AUTH_REQUESTS_PER_MINUTE:30}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/}
    api-key: ${OPENAI_API_KEY}
    timeout: 30s
    max-response-bytes: 262144
  limits:
    requests-per-minute: 20
    concurrent-requests: 2
    daily-tokens: 200000
    lease: 60s
    max-request-bytes: 65536
    global-concurrent-requests: ${GLOBAL_CONCURRENT_REQUESTS:8}
    global-daily-tokens: ${GLOBAL_DAILY_TOKENS:2000000}
    body-timeout: ${REQUEST_BODY_TIMEOUT:5s}
    concurrent-bodies: ${CONCURRENT_REQUEST_BODIES:16}
  pricing:
    models:
      "[gpt-4.1-mini]":
        input-usd-per-million: 0.40
        cached-input-usd-per-million: 0.10
        output-usd-per-million: 1.60
      "[gpt-4.1]":
        input-usd-per-million: 2.00
        cached-input-usd-per-million: 0.50
        output-usd-per-million: 8.00
  models:
    translation-fast:
      provider: openai
      model: ${OPENAI_FAST_MODEL:gpt-4.1-mini}
      max-input-bytes: 20000
      max-output-tokens: 4096
      structured-output: true
    translation-quality:
      provider: openai
      model: ${OPENAI_QUALITY_MODEL:gpt-4.1}
      max-input-bytes: 20000
      max-output-tokens: 4096
      structured-output: true
