openapi: 3.0.3
info:
  title: AI Translator API
  version: 0.0.1
  description: Plain-text translation using server-approved model aliases with per-account cost tracking.
security:
  - bearerAuth: []
paths:
  /v1/auth/register:
    post:
      operationId: register
      summary: Create a local user account as an administrator
      description: Requires a bearer token with the users:create scope. Usernames are case insensitive. The new user can sign in with the supplied credentials.
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '201': {description: Account created}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: Missing or invalid bearer token}
        '403': {description: Required users:create scope missing}
        '409': {description: Username unavailable}
        '408': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/auth/login:
    post:
      operationId: login
      summary: Authenticate a local account and issue a token pair
      description: Creates an independent refresh-token family. Invalid username/password returns a generic 401. Existing accounts have independent per-account rate limits; unknown usernames use a separate per-address bucket.
      security: []
      requestBody: {$ref: '#/components/requestBodies/Credentials'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a single-use refresh token for a new token pair
      description: Send without an Authorization header. Rotates the refresh token without extending the absolute family expiry. Valid sessions have independent family rate limits; invalid probes use a separate per-address bucket. A consumed-token replay revokes the entire family even if session admission is throttled. Invalid tokens return 401 unless invalid-probe throttling returns 429.
      security: []
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '200': {$ref: '#/components/responses/Tokens'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh-token family
      description: Send without an Authorization header. An older consumed member can revoke the family. Well-formed unknown or already revoked tokens return 204. Logout is independent of exhausted login/refresh buckets. Existing access tokens remain valid until their expiration.
      security: []
      requestBody: {$ref: '#/components/requestBodies/RefreshToken'}
      responses:
        '204': {description: Refresh session revoked or already unavailable}
        '400': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/models:
    get:
      operationId: listModels
      summary: List model names and aliases available to the caller
      description: Requires the translate:write scope.
      responses:
        '200':
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, provider, maxInputBytes]
                  properties:
                    id: {type: string, description: Alias to send in translation requests, example: translation-fast}
                    name: {type: string, description: Configured model name for display, example: gpt-4.1-mini}
                    provider: {type: string}
                    maxInputBytes: {type: integer}
        '401': {description: Missing or invalid bearer token}
        '403': {description: Required scope missing}
  /v1/translation-cost:
    get:
      operationId: getTranslationCost
      summary: Get recorded translation costs for the caller's account
      description: Requires the translate:write scope. The total includes known costs for retained request records.
      responses:
        '200':
          description: Account cost summary
          content:
            application/json:
              schema:
                type: object
                required: [totalCostUsd, unpricedRequests]
                properties:
                  totalCostUsd: {type: number, minimum: 0, example: 0.000072}
                  unpricedRequests: {type: integer, format: int64, minimum: 0, description: Terminal requests with unknown cost}
        '401': {description: Missing or invalid bearer token}
        '403': {description: Required scope missing}
        '500': {$ref: '#/components/responses/Error'}
  /v1/translations:
    post:
      operationId: translate
      summary: Translate one independent text input
      description: >-
        Requires translate:write and any model-specific scope. Languages may be given by code or name.
        Specify a source language for manual translation, or enable detection and omit it.
        Account and deployment-wide concurrency and daily token limits apply.
        Request bodies have bounded admission and a total upload deadline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, targetLanguage, model]
              properties:
                text: {type: string, minLength: 1, maxLength: 10000, example: 'Good morning!'}
                sourceLanguage: {type: string, minLength: 1, maxLength: 80, example: en}
                targetLanguage: {type: string, minLength: 1, maxLength: 80, example: ru}
                detectSourceLanguage: {type: boolean, default: false}
                includeUsage:
                  type: boolean
                  default: false
                  description: Request alternatives for ambiguous short inputs and examples for words or short expressions.
                model: {type: string, maxLength: 100, example: translation-fast}
      responses:
        '200':
          description: Complete translation
          content:
            application/json:
              schema:
                type: object
                required: [requestId, translatedText, sourceLanguage, targetLanguage, model, costUsd]
                properties:
                  requestId: {type: string, format: uuid}
                  translatedText: {type: string}
                  alternatives:
                    type: array
                    description: Translations of distinct plausible meanings. Omitted when empty or not requested.
                    items: {type: string}
                  examples:
                    type: array
                    description: Usage examples for words and short expressions. Omitted when empty or not requested.
                    items:
                      type: object
                      required: [sourceText, translatedText]
                      properties:
                        sourceText: {type: string}
                        translatedText: {type: string}
                  sourceLanguage: {type: string, description: Selected language or detected code or name. The value und means detection was inconclusive.}
                  targetLanguage: {type: string}
                  model: {type: string}
                  costUsd: {type: number, minimum: 0, nullable: true, description: Estimated provider cost in USD. Null when pricing or usage is unavailable., example: 0.000072}
        '400': {$ref: '#/components/responses/Error'}
        '401': {description: Missing or invalid bearer token}
        '403': {description: Required scope or model permission missing}
        '408': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
components:
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [username, password]
            properties:
              username: {type: string, pattern: '^[A-Za-z0-9_]{3,64}$', description: Case-insensitive local username}
              password: {type: string, format: password, minLength: 12, maxLength: 72, description: At most 72 UTF-8 bytes; BCrypt passwords are not truncated}
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refreshToken]
            properties:
              refreshToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: Opaque single-use refresh secret}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Tokens:
      description: Self-issued access JWT and opaque refresh token; all durations in seconds. Store securely and replace both tokens after refresh.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
        Pragma:
          schema: {type: string, enum: [no-cache]}
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
            properties:
              accessToken: {type: string, description: RS256 JWT with issuer, audience, stable UUID subject, expiry and translate:write scope}
              tokenType: {type: string, enum: [Bearer]}
              expiresIn: {type: integer, format: int64, minimum: 1, example: 900}
              refreshToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
              refreshExpiresIn: {type: integer, format: int64, minimum: 0, example: 2592000}
    Error:
      description: Request rejected or translation unavailable; code identifies the failure.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
