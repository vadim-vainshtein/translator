services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/translator
      DB_USER: translator
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or .env}
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt-private-key
      JWT_ISSUER: ${JWT_ISSUER:-translator}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-translator-api}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-30}
      GLOBAL_CONCURRENT_REQUESTS: ${GLOBAL_CONCURRENT_REQUESTS:-8}
      GLOBAL_DAILY_TOKENS: ${GLOBAL_DAILY_TOKENS:-2000000}
      REQUEST_BODY_TIMEOUT: ${REQUEST_BODY_TIMEOUT:-5s}
      CONCURRENT_REQUEST_BODIES: ${CONCURRENT_REQUEST_BODIES:-16}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your shell or .env}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-gpt-4.1-mini}
      OPENAI_QUALITY_MODEL: ${OPENAI_QUALITY_MODEL:-gpt-4.1}
    secrets:
      - jwt-private-key
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translator
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator -d translator"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  jwt-private-key:
    environment: JWT_PRIVATE_KEY
volumes:
  postgres-data:
